# go-ca configuration. go-ca reads config.yaml next to its executable, or
# the file given with --config. Relative paths are relative to this file's
# folder. Keep the file readable by its owner only (chmod 600) when it holds
# database passwords.

general:
  # Folder with the .gca and .xdb databases (required).
  data_dir: data
  # Address to listen on (HTTPS); all interfaces by default.
  listen: ":8443"
  # PEM certificate and key for HTTPS. Empty: a self-issued certificate in
  # <data_dir>/.go-ca/ is created and renewed automatically.
  tls_cert: ""
  tls_key: ""
  # Idle timeout of server and database sessions (Go duration, at least 1m).
  idle_timeout: 30m
  # Largest upload accepted (database file or items to import), in MB.
  max_upload_mb: 256
  # Hash of the server password that protects the whole web UI.
  # Create it with: go-ca set-password
  password_hash: ""

# Databases go-ca knows by name. Other .gca and .xdb files directly in
# data_dir are still listed and can be opened in the web UI.
databases:
  # A database with a password is opened when go-ca starts and stays open,
  # so that go-ca can do CA work on it in the background. Its password
  # cannot be changed in the web UI; logging in there still needs it.
  - name: Home Lab CA          # shown in the web UI
    type: file                 # the only type: a go-ca database file
    path: homelab.gca          # relative to data_dir, may be in a subfolder
    password: "change-me"

  # Without a password the database is only listed under its name.
  - name: Old Archive
    type: file
    path: archive/old.gca
