# OpenKCA configuration. OpenKCA reads config.yaml next to its executable, or
# the file given with --config. Relative paths are relative to this file's
# folder. Keep the file readable by its owner only (chmod 600) when it holds
# database passwords.

general:
  # Folder with the .okca and .xdb databases (required).
  data_dir: data
  # Address to listen on; all interfaces by default.
  listen: ":9443"
  # true: OpenKCA serves HTTPS itself. false: plain HTTP, for a TLS proxy
  # (nginx, Caddy, Cloudflare Tunnel, ...) in front of OpenKCA, listed in
  # trusted_proxies. Opened directly over plain HTTP, the server password
  # and the session travel in clear text.
  https: true
  # PEM certificate and key for HTTPS. Empty: a self-issued certificate in
  # <data_dir>/.openkca/ is created and renewed automatically. Not used
  # without HTTPS.
  tls_cert: ""
  tls_key: ""
  # Reverse proxies (IP addresses or CIDR ranges) whose X-Forwarded-For and
  # X-Forwarded-Proto headers are believed: the client's address counts for
  # the login rate limit and the audit log, and its scheme for Secure
  # cookies and HSTS. Others' forwarding headers are ignored.
  trusted_proxies: []          # e.g. ["127.0.0.1", "10.0.0.0/8"]
  # Idle timeout of server and database sessions (Go duration, at least 1m).
  idle_timeout: 30m
  # Largest upload accepted (database file or items to import), in MB.
  max_upload_mb: 256
  # Hash of the server password that protects the whole web UI.
  # Create it with: openkca set-password
  password_hash: ""
  # Security keys (YubiKey, Nitrokey, ...) and passkeys as unlock methods
  # of databases. They are bound to rp_id, the host name you open OpenKCA
  # with (a domain name, not an IP address), and the browser must trust
  # OpenKCA's TLS certificate. Without rp_id they are not offered.
  webauthn:
    rp_id: ""                  # e.g. ca.example.org
    # rp_name: OpenKCA         # shown by the authenticator
    # origins:                 # default: https://<rp_id> and https://<rp_id>:<port of listen>
    #   - https://ca.example.org:9443

# Publication of CRLs and CA certificates.
crl:
  # Plain HTTP address serving /<authority ID>.crl, .crt and .pem for every
  # CA; "" turns the server off.
  listen: ":9080"
  # Where that server is reachable, as clients should try it: offered (and
  # checked by default) as CRL distribution point and CA issuer (AIA) when
  # certificates are created, signed or renewed. Every URL is written into
  # those certificates and cannot change for them later. Without base URLs
  # nothing is offered.
  base_urls:
    - http://pki.example.org
    - http://pki.lan:9080

# Databases OpenKCA knows by name. Other .okca and .xdb files directly in
# data_dir are still listed and can be opened in the web UI.
databases:
  # A database with a password is opened when OpenKCA starts and stays open,
  # so that OpenKCA can do CA work on it in the background (CRLs are signed
  # automatically). The unlock method this password opens cannot be changed
  # or removed in the web UI; logging in there still needs an unlock method.
  - name: Home Lab CA          # shown in the web UI
    type: file                 # the only type: an OpenKCA database file
    path: homelab.okca          # relative to data_dir, may be in a subfolder
    password: "change-me"

  # Without a password the database is only listed under its name.
  - name: Old Archive
    type: file
    path: archive/old.okca
