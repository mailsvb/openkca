name: Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The SSH tests also compare against puttygen; ssh-keygen is on the runner.
      - name: Install puttygen
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends putty-tools

      # Some tests compare against the openssl command line; the runner has it.
      - name: Test
        run: |
          echo "::notice title=openssl::$(openssl version)"
          echo "::notice title=ssh::$(ssh -V 2>&1), $(puttygen --version | head -1)"
          set +e
          go test -race -count=1 ./... 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          # failing tests as annotations, readable without the full log
          grep -E -A8 '^\s*--- FAIL|^FAIL|panic:' test.log | head -60 | while IFS= read -r line; do
            echo "::error title=go test::$line"
          done
          exit "$status"
