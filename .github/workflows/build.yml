name: Build

# Runs only manually and makes an official release: the given version, or
# VERSION with the fix number increased by 1, tagged v<version> with a GitHub
# release holding the binaries, the signed rpms and the Windows MSI; VERSION
# on main is then updated and the rpm repository on GitHub Pages rebuilt.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version X.Y.Z (empty: current version with the fix number + 1)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: v
        env:
          WANT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main, not $GITHUB_REF_NAME"
            exit 1
          fi
          version=$(.github/scripts/version.sh "$WANT")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice title=Version::$version"

  test:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="openkca_${VERSION}_${GOOS}_${GOARCH}"
          ext=""
          if [ "$GOOS" = windows ]; then ext=.exe; fi
          mkdir -p "dist/$name" pkg
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/$name/openkca$ext" ./cmd/openkca
          cp -r README.md docs "dist/$name/"
          cp config.example.yaml "dist/$name/"
          cp internal/web/static/htmx.LICENSE "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then
            zip -qr "../pkg/$name.zip" "$name"
          else
            tar -czf "../pkg/$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: openkca_${{ env.VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: pkg/*
          if-no-files-found: error
          retention-days: 30

  # The rpm packages for Linux amd64 and arm64, built with nfpm and signed
  # with the PGP package key, which the repo job signs the repository with
  # as well.
  rpm:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # nfpm reads the key armored from a file
      - name: Package signing key
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          bash packaging/repo/import-key.sh "$RUNNER_TEMP/signing.asc"
          echo "SIGNING_KEY_FILE=$RUNNER_TEMP/signing.asc" >> "$GITHUB_ENV"

      - name: Build
        env:
          NFPM_RPM_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p build/pkg/linux pkg
          # openkca setup without --config finds the service's configuration
          pkg="-X github.com/mailsvb/openkca/internal/config.packagedPath=/etc/openkca/config.yaml"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION $pkg" \
              -o build/pkg/linux/openkca ./cmd/openkca
            ARCH=$arch go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0 \
              package --config packaging/linux/nfpm.yaml --packager rpm --target pkg/
          done
          rm -f "$SIGNING_KEY_FILE"
          ls -l pkg

      - uses: actions/upload-artifact@v7
        with:
          name: openkca_${{ env.VERSION }}_linux_rpm
          path: pkg/*.rpm
          if-no-files-found: error
          retention-days: 30

  # The Windows installer, built with WiX: openkca.exe as the OpenKCA
  # service, its configuration and data in C:\ProgramData\OpenKCA. Unsigned.
  msi:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      WIX_VERSION: 5.0.2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build openkca.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          # ${ProgramData} is expanded by openkca at run time
          go build -trimpath -o build/pkg/windows/openkca.exe \
            -ldflags '-s -w -X main.version='"$VERSION"' -X github.com/mailsvb/openkca/internal/config.packagedPath=${ProgramData}\OpenKCA\config.yaml' \
            ./cmd/openkca

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version "$WIX_VERSION"
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build the MSI
        run: |
          for ext in UI Util Firewall; do
            wix extension add --global "WixToolset.$ext.wixext/$WIX_VERSION"
          done
          mkdir -p pkg
          wix build packaging/windows/openkca.wxs packaging/windows/ui.wxs -arch x64 \
            -d Version="$VERSION" -d BinDir=build/pkg/windows -d RepoDir=. \
            -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext -ext WixToolset.Firewall.wixext \
            -o "pkg/openkca_${VERSION}_windows_amd64.msi"
          ls -l pkg

      - uses: actions/upload-artifact@v7
        with:
          name: openkca_${{ env.VERSION }}_windows_msi
          path: pkg/*.msi
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [version, test, build, rpm, msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: pkg
          merge-multiple: true

      - name: Checksums
        run: cd pkg && sha256sum * > "openkca_${VERSION}_checksums.txt" && cat "openkca_${VERSION}_checksums.txt"

      # The tag marks exactly the commit that was built.
      - name: Tag and release
        run: |
          gh release create "v$VERSION" pkg/* \
            --target "$GITHUB_SHA" \
            --title "OpenKCA $VERSION" \
            --generate-notes

      - name: Record the version on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --ff-only origin main
          echo "$VERSION" > VERSION
          if git diff --quiet; then exit 0; fi
          git commit -m "Set version to $VERSION after release v$VERSION" VERSION
          git push origin main

  # The zypper/dnf repository on GitHub Pages, rebuilt from the rpms of the
  # five newest releases, so older versions drop out. Pages must be set to
  # deploy from GitHub Actions.
  repo:
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Install createrepo_c and rpm
        run: sudo apt-get update -q && sudo apt-get install -y -q createrepo-c rpm

      - name: Import the signing key
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
        run: bash packaging/repo/import-key.sh

      - name: Build the repository
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
          KEEP: 5
        run: bash packaging/repo/build.sh site

      # artifacts outlive an attempt, so a re-run of this job would find the
      # first attempt's as well, which deploy-pages refuses: one per attempt
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}

      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
