{{template "head" .}}
<section class="card narrow">
  <h1>{{T "login.heading"}}</h1>
  <p class="muted small">{{T "app.tagline"}}</p>
  <p class="muted">{{T "login.intro"}}</p>
  {{if .Data.Insecure}}<p class="warn small" role="note" data-insecure-note hidden>{{T "login.insecure"}}</p>{{end}}
  <form method="post" action="/login">
    <label for="password">{{T "login.password"}}</label>
    <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
    <button type="submit">{{T "login.submit"}}</button>
  </form>
  {{if .Data.Passkeys}}
  <div class="passkey-login" data-passkey-section hidden>
    <div class="or-divider"><span>{{T "login.or"}}</span></div>
    <button type="button" class="secondary" data-passkey-login hidden>{{T "login.passkey"}}</button>
    <p class="error" role="alert" data-webauthn-error data-cancelled="{{T "passkeys.error.cancelled"}}" data-failed="{{T "passkeys.error.webauthn"}}" hidden></p>
  </div>
  {{end}}
</section>
{{template "foot" .}}
