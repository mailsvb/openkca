{{template "head" .}}
<h1>{{T "newkey.heading"}}</h1>
<section class="card">
  <form method="post" action="/db/{{.DB.Name}}/new/key" class="stack wide">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label for="name">{{T "col.name"}}</label>
    <input type="text" id="name" name="name" value="{{.Data.Name}}" required autofocus>
    <span>{{T "col.keytype"}}</span>
    {{template "keypicker" .Data.Picker}}
    <span class="muted small">{{T "newkey.help"}}</span>
    <button type="submit">{{T "newkey.submit"}}</button>
  </form>
</section>
{{template "expertswitch" .}}
{{template "foot" .}}
