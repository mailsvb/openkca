{{template "head" .}}
<h1>{{T "newkey.heading"}}</h1>
<section class="card">
  <form method="post" action="/db/{{.DB.Name}}/new/key" class="stack">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label for="name">{{T "col.name"}}</label>
    <input type="text" id="name" name="name" value="{{.Data.Name}}" required autofocus>
    <label for="type">{{T "col.keytype"}}</label>
    <select id="type" name="type">{{$t := .Data.Type}}{{range .Data.KeyGroups}}<optgroup label="{{T .Label}}">{{range .Choices}}<option value="{{.Value}}"{{if eq .Value $t}} selected{{end}}>{{.Label}}</option>{{end}}</optgroup>{{end}}</select>
    <span class="muted small">{{T "newkey.help"}}</span>
    <button type="submit">{{T "newkey.submit"}}</button>
  </form>
</section>
{{template "foot" .}}
