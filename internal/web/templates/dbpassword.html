{{template "head" .}}
<h1>{{T "dbpw.heading"}}</h1>
<section class="card">
  {{if .DB.Background}}
  <p>{{T "dbpw.background"}}</p>
  {{else}}
  <p class="muted">{{T "dbpw.intro"}}</p>
  <form method="post" action="/db/{{.DB.Name}}/password" class="stack">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label for="old">{{T "dbpw.old"}}</label>
    <input type="password" id="old" name="old" autocomplete="current-password" required>
    <label for="new">{{T "dbpw.new"}}</label>
    <input type="password" id="new" name="new" autocomplete="new-password" minlength="{{.Data.MinLen}}">
    <label for="new2">{{T "dbpw.new2"}}</label>
    <input type="password" id="new2" name="new2" autocomplete="new-password" minlength="{{.Data.MinLen}}">
    <span class="muted small">{{T "dbpw.keep" .Data.MinLen}}</span>
    <details>
      <summary>{{T "dbpw.kdf.heading"}}</summary>
      <div class="stack">
        <p class="muted small">{{T "dbpw.kdf.help" .Data.Default.MemoryMiB .Data.Default.Time}}</p>
        <label for="kdf_memory">{{T "dbpw.kdf.memory"}}</label>
        <select id="kdf_memory" name="kdf_memory">{{$m := .Data.Memory}}{{range .Data.MemoryChoices}}<option value="{{.}}"{{if eq . $m}} selected{{end}}>{{T "dbpw.kdf.mib" .}}</option>{{end}}</select>
        <label for="kdf_time">{{T "dbpw.kdf.time"}}</label>
        <select id="kdf_time" name="kdf_time">{{$t := .Data.Time}}{{range .Data.TimeChoices}}<option value="{{.}}"{{if eq . $t}} selected{{end}}>{{.}}</option>{{end}}</select>
      </div>
    </details>
    <button type="submit">{{T "dbpw.submit"}}</button>
  </form>
  {{end}}
</section>
{{template "foot" .}}
