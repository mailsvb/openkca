{{template "head" .}}
<h1>{{T "dbpw.heading"}}</h1>
<section class="card">
  <p class="muted">{{T "dbpw.intro"}}</p>
  <form method="post" action="/db/{{.DB.Name}}/password" class="stack">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label for="old">{{T "dbpw.old"}}</label>
    <input type="password" id="old" name="old" autocomplete="current-password">
    <label for="new">{{T "dbpw.new"}}</label>
    <input type="password" id="new" name="new" autocomplete="new-password">
    <label for="new2">{{T "dbpw.new2"}}</label>
    <input type="password" id="new2" name="new2" autocomplete="new-password">
    <button type="submit">{{T "dbpw.submit"}}</button>
  </form>
</section>
{{template "foot" .}}
